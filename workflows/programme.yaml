real_record_rules:
  synthetic_evidence: excluded from actual claims
  approved_decision: requires actual authenticated approval; checker only checks presence
  not_applicable: requires scope reason
  source_revision: repository commit SHA, not blob SHA
  pass: does not supersede failed or missing evidence elsewhere
