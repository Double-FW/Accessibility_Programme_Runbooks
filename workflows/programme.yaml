  trigger: Brief, architecture choice, supplier selection or renewal
  prerequisites:
  - Requirements, delivery owners and relevant permission
  activities:
  - Specify task outcomes, acceptance evidence, supplier responsibilities and integration
    needs
  - Select specialist modules and plan content, research and evaluation early
  - 'Require system-assurance coverage for every in-scope foundation and pattern/component:
    guidance, manual/automatable assessment, design requirements, techniques, methodologies,
    reference implementations and user ACT-style scripts'
  human_owner: Service/procurement owner with architecture, design and content leads
  ai_action: Draft briefs, compare supplier evidence and suggest options
  evidence_required:
  - Traceable brief and assessment plan
  - Supplier claims distinguished from locally verified behaviour
  - System-assurance plan and linked evidence/gaps for affected decisions
  exit_condition: Receiving teams understand requirements, evidence and unresolved
    commitments
  next_route: P06
  return_route: P04
