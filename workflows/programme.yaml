  trigger: Release, acceptance, procurement or operational transition decision
  prerequisites:
  - Evidence package, open barriers, authority and operational readiness
  activities:
  - Review material failures, uncertainty, interim access and correction plans
  - Record authorised decision, receiving owner, conditions and continuity/rollback
  - Retain unresolved system-assurance, accessible-usability and brand communication
    gaps in affected release/transition decisions
  human_owner: Authorised release/service owner; escalate beyond delegation
  ai_action: Assemble evidence, challenge unsupported claims and draft decision options
  evidence_required:
  - Authenticated decision reference
  - Operational handoff and open-issue register
  - System-assurance plan and linked evidence/gaps for affected decisions
  exit_condition: Decision is recorded within authority; unresolved evidence is not
    relabelled
