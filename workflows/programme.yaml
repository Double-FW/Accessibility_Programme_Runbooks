- id: P07
  title: Evaluate and correct
  trigger: New/changed delivery, failure or retest
  prerequisites:
  - Identified build/assets, methods, environment and authorised evidence access
  activities:
  - Combine applicable automated, manual, AT, editorial and task/research evidence
  - Record actual results and limits; correct and retest failures
  - Check foundation and component coverage, automation limits, user ACT-style outcomes
    and brand communication; component reuse and a clean scan do not prove usable
    journeys
  human_owner: QA/test owner with specialists, editorial reviewers and research participants
  ai_action: Run supported authorised checks, organise findings and draft remediation
    options
  evidence_required:
  - Raw results, method, environment, coverage and limitations
  - Remediation/retest records and missing evidence
  - System-assurance plan and linked evidence/gaps for affected decisions
  exit_condition: Evidence supports a decision or explicitly identifies a block; no
    silent pass
  next_route: P08
  return_route: P06
