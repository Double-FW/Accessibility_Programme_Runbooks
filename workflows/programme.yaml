routes:
- id: R01
  trigger: Urgent or serious exclusion
  action: Activate the agreed immediate support/recovery route and preserve the defect
  stage: P09
  follow_up: P07
- id: R02
  trigger: Missing authority, scope or permission
  action: Block the affected action; request the missing decision and continue independent
    work
  stage: P01
  follow_up: P02
- id: R03
  trigger: Purchased service, procurement or renewal
  action: Evaluate the actual configured tasks and supplier evidence; record contractual
    dependencies
  stage: P05
  follow_up: P07
- id: R04
  trigger: Confidential individual support or employment impact
  action: Separate restricted support/fair-review records from systemic service correction
  stage: P03
  follow_up: P09
- id: R05
  trigger: Failed, missing, uncertain or errored assessment evidence
  action: Keep the result; investigate, correct and retest before affected claims
  stage: P07
  follow_up: P06
- id: R06
  trigger: Material source, law, policy, supplier, model, component or audience change
  action: Perform source/context impact assessment and reopen affected decisions
  stage: P02
  follow_up: P07
- id: R07
  trigger: Contradictory or unavailable source
  action: Classify authority, record limits and route uncertainty; do not invent a
    replacement
  stage: P02
  follow_up: P01
- id: R08
  trigger: Sensitive data, telemetry, AT return path or AI integration
  action: Review actual flows and approved purposes using S19–S20 before affected
    processing
  stage: P05
  follow_up: P03
- id: R09
  trigger: Aggregate improvement masks disparity or harmful outcome
  action: Preserve subgroup evidence and investigate without inferring diagnosis
  stage: P09
  follow_up: P03
- id: R10
  trigger: Unsubstantiated claim or decision beyond delegation
  action: Prepare a qualified draft; route to authorised human and retain negative
    evidence
  stage: P08
  follow_up: P07
- id: R11
  trigger: Alternative channel, assistance or handoff
  action: Evaluate information, control, privacy, availability, effort and outcome
    across the whole journey
  stage: P05
  follow_up: P07
- id: R12
  trigger: Document, email, media or specialist interaction
  action: Select source modules from the brief and preserve exact production handoffs
  stage: P05
  follow_up: P06
- id: R13
  trigger: Synthetic evidence or generated approval presented as real
  action: Exclude it from real claims and recover provenance; seek actual evidence/decision
  stage: P07
  follow_up: P08
- id: R14
  trigger: AI errors or review burden undermine benefit
  action: Reduce or suspend affected delegation and review the tool/process with its
    owner
  stage: P09
  follow_up: P04
- id: R15
  trigger: Missing or changed UX design/branding system coverage, or a gap between
    system, QA and actual consumer
  action: Assign system capability/assurance work; trace foundations, components,
    brand purposes, tests and affected decisions without inferring a pass
  stage: P04
  follow_up: P07
