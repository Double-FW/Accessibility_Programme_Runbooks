  coverage_rules:
  - Every in-scope foundation needs guidance and manual coverage plus meaningful automatable
    checks or a reasoned manual-primary classification
  - Every in-scope pattern/component needs linked design requirements, techniques,
    methodologies, reference implementations and user ACT-style scripts; missing assets
    have owned gap plans
  - Keep applicable conformance, accessible usability and brand communication outcomes
    distinct
  - Reference implementations and reused components support only their evaluated scope;
    verify configured use and complete journeys
  - Detailed assets remain in owning systems; preserve IDs, revisions, provenance
    and reverse consumer dependencies
