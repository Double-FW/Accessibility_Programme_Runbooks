- id: P04
  title: Agree strategy and funded delivery
  trigger: Priorities, resources or roadmap require a decision
  prerequisites:
  - Scoped requirements and qualified baseline
  activities:
  - Compare interventions across policy, process, services, technology and capability
  - Agree outcomes, dependencies, resources, measures and accountable owners
  - Plan and resource adoption, creation or remediation of accessible UX and branding
    systems, with traceable QA and usable brand outcomes
  human_owner: Sponsor and portfolio owner within confirmed delegation
  ai_action: Compare options, model dependencies and draft a feasible roadmap
  evidence_required:
  - Programme plan with confirmed and proposed resources separated
  - Decision records including consequences of deferral
  - System-assurance plan and linked evidence/gaps for affected decisions
  exit_condition: Affected work funded and owned; unfunded proposals remain proposals
  next_route: P05
  return_route: P03
  source_ids:
