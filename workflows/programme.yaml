  trigger: Live service, incident, feedback, agreed review or material change
  prerequisites:
  - Operational owner, feedback routes and approved monitoring scope
  activities:
  - Respond to barriers and track meaningful resolution
  - Report evidence and decisions; refresh affected sources and feed learning into
    normal work
  - Trace foundation, token, component, reference implementation and brand-rule changes
    to affected consumers for regression and outcome review
  human_owner: Operational/service owner with programme and reporting owners
  ai_action: Analyse authorised signals, route issues, draft reports and flag relevant
    changes
  evidence_required:
  - Outcome reports and owned corrective actions
  - Source impact assessments and learning decisions
  - System-assurance plan and linked evidence/gaps for affected decisions
  exit_condition: Actions owned and next review/event route known; operation remains
    continuous
