schema_version: '1.0'
framework_version: 0.2.0
status: draft_for_local_adoption
execution_model: Definitions only; no runner, integration, permission enforcement
  or approval authentication is provided
stage_owner: framework/programme-cycle.md
variant_owner:
  employee: runbooks/employee-services.md
  customer: runbooks/customer-services.md
states:
- draft
- ready_for_review
- approved
- in_progress
- blocked
- awaiting_evidence
- complete
- reopened
assessment_classes:
- pass
- fail
- not_assessed
- blocked
- not_applicable
- inconclusive
- tool_error
assessment_mapping_rule: Keep raw_result and source vocabulary. Explicitly map without
  loss; inconclusive and tool_error remain separate from pass/fail. Local adoption
  must confirm mappings.
state_rules:
  draft: Facts/assumptions separated; no approval implied
  ready_for_review: Required records assembled; gaps visible
  approved: Actual authorised human decision required; generated strings cannot authenticate
    it
  in_progress: Task within permission and scope
  blocked: Affected dependency prevents next action; independent work may continue
  awaiting_evidence: Conclusion not supported yet
  complete: Activity completed; does not imply assessment pass or approval
  reopened: Material change or new evidence invalidates reliance on a prior decision
gates:
- id: G01
  condition: scope and actual authority support the proposed action
  failure_route: R02
- id: G02
  condition: evidence sufficient for the scoped conclusion; all limits retained
  failure_route: R05
- id: G03
  condition: authenticated human decision within delegation
  failure_route: R10
- id: G04
  condition: operational handoff, open issues, support and recovery known
  failure_route: R11
- id: G05
  condition: needed source currency and applicability verified
  failure_route: R06
- id: G06
  condition: affected system assets have traceable design, implementation and manual/automation/user-task
    coverage; usability and brand outcome gaps remain visible
  failure_route: R15
stages:
- id: P01
  title: Establish remit and authority
  trigger: New programme, scope change or ownership gap
  prerequisites:
  - Available organisational facts and affected activity
  activities:
  - Confirm intended outcomes, entities, service boundaries and existing governance
  - Involve affected people in framing and name actual decision owners
  human_owner: Programme sponsor or delegated owner
  ai_action: Structure intake, identify contradictions and draft charter options
  evidence_required:
  - Scope and authority record
  - Participation and unresolved decision record
  exit_condition: Remit and decision ownership confirmed, or affected decisions explicitly
    pending
  next_route: P02
  return_route: P01
  source_ids:
  - S01
  - S02
  - S03
  - S04
  - S05
  permission_reference: Local delegation record required for execution; advisory drafting
    may proceed within mandate
  runbook: shared
- id: P02
  title: Map obligations and commitments
  trigger: New scope, jurisdiction, contract or policy change
  prerequisites:
  - P01 scoped context; do not guess missing entity or service facts
  activities:
  - Route legal, contractual and adopted-policy applicability for competent review
  - Link requirements to applicable activities and identify unverified claims
  human_owner: Competent legal/compliance or policy owner within remit
  ai_action: Retrieve sources and draft applicability, conflict and uncertainty records
  evidence_required:
  - Requirement register with authority and versions
  - Actual reviewer disposition or open question
  exit_condition: Requirements verified for affected decisions; uncertainties remain
    explicit
  next_route: P03
  return_route: P01
  source_ids:
  - S02
  - S03
  - S08
  - S09
  - S10
  permission_reference: Local delegation record required for execution; advisory drafting
    may proceed within mandate
  runbook: shared
- id: P03
  title: Understand participation and capability
  trigger: Baseline needed or unexplained barrier/outcome
  prerequisites:
  - Scoped activities and approved access to available evidence
  activities:
  - Map tasks, contexts, dependencies and participation gaps
  - Combine capability, technical and human evidence without merging their meanings
  - Inventory accessible UX design and branding systems, foundations, patterns/components,
    ownership, adoption and assurance gaps
  human_owner: Research/service owner with affected people and relevant specialists
  ai_action: Structure approved findings and suggest research questions and gaps
  evidence_required:
  - Baseline with coverage, dates and missingness
  - Accessible participation plan and influence record
  - System-assurance plan and linked evidence/gaps for affected decisions
  exit_condition: Enough qualified evidence to propose priorities; remaining unknowns
    recorded
  next_route: P04
  return_route: P02
  source_ids:
  - S04
  - S06
  - S11
  - S12
  - S17
  - S18
  - S19
  - S32
  - S33
